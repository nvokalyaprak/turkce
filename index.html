<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1d4ed8">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg">
<link rel="apple-touch-icon" href="icon.svg">
<title>Türkçe Ders Asistanı</title>
<style>
:root{--bg:#f4f6fb;--card:#fff;--tx:#1b2333;--mu:#6b7488;--pr:#1d4ed8;--pr2:#e8efff;--ok:#16a34a;--wa:#d97706;--er:#dc2626;--bd:#e3e7f0}
@media(prefers-color-scheme:dark){:root{--bg:#0f1420;--card:#182030;--tx:#e8ecf5;--mu:#93a0ba;--pr:#6b95ff;--pr2:#1f2d4d;--bd:#26314a}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding-bottom:calc(72px + env(safe-area-inset-bottom))}
header{position:sticky;top:0;z-index:5;background:var(--pr);color:#fff;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;font-weight:700}
main{max-width:760px;margin:0 auto;padding:12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:12px}
h2{font-size:17px;margin:0 0 8px}h3{font-size:16px;margin:16px 0 4px;color:var(--pr)}
.mu{color:var(--mu);font-size:13px}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom);z-index:6}
nav button{flex:1;border:0;background:none;color:var(--mu);padding:10px 0 8px;font-size:11px;cursor:pointer}
nav button b{display:block;font-size:20px;font-weight:400}
nav button.on{color:var(--pr);font-weight:700}
button.b,label.b{display:inline-block;border:0;border-radius:10px;background:var(--pr);color:#fff;padding:10px 14px;font-size:15px;cursor:pointer;margin:2px 4px 2px 0}
button.s,label.s{background:var(--pr2);color:var(--pr)}button.d{background:#fee2e2;color:var(--er)}
button.sm{padding:4px 10px;font-size:13px}
input,select,textarea{width:100%;border:1px solid var(--bd);border-radius:10px;padding:10px;font:inherit;background:var(--card);color:var(--tx);margin:4px 0 8px}
textarea{min-height:90px}
input[type=checkbox]{width:auto;margin:0 6px 0 0}
.row{display:flex;gap:8px;align-items:center}.row>*{flex:1}
.days{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 8px}.days label{border:1px solid var(--bd);border-radius:10px;padding:6px 10px;font-size:14px}
.bar{height:8px;border-radius:8px;background:var(--bd);overflow:hidden}.bar i{display:block;height:100%;background:var(--pr)}
.tag{display:inline-block;background:var(--pr2);color:var(--pr);border-radius:8px;padding:2px 8px;font-size:12px;margin:2px 4px 2px 0}
.tag.w{background:#fef3c7;color:#92400e}.tag.g{background:#dcfce7;color:#166534}
.ses{display:flex;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--bd)}.ses:last-child{border:0}
.ses .dt{width:78px;flex:none;font-size:13px;color:var(--mu)}.ses .tt{flex:1;min-width:0;cursor:pointer}
.warn{background:#fef3c7;color:#92400e;border-radius:10px;padding:10px;margin:8px 0;font-size:14px}
.q{display:flex;gap:10px;align-items:flex-start}.q img{width:76px;height:76px;object-fit:cover;border-radius:10px;background:var(--bd);flex:none}
.q .t{flex:1;min-width:0}
.modal{position:fixed;inset:0;background:var(--bg);z-index:20;overflow:auto;display:none}
#modal2{z-index:25}
.modal .in{max-width:760px;margin:0 auto;padding:12px;padding-bottom:60px}
.modal img.big{width:100%;border-radius:12px;margin-bottom:8px}
.ai{font-size:15px}.ai p{margin:4px 0}.ai .li{margin:2px 0 2px 8px}
.pre{white-space:pre-wrap;font-size:13px;background:var(--pr2);border-radius:10px;padding:10px;max-height:160px;overflow:auto}
.big-t{font-size:56px;font-weight:700;text-align:center;font-variant-numeric:tabular-nums;margin:6px 0}
.flip{min-height:110px;display:flex;align-items:center;justify-content:center;text-align:center;border:1px dashed var(--bd);border-radius:12px;padding:12px;cursor:pointer;margin-bottom:8px}
#print{display:none;position:fixed;inset:0;background:#fff;color:#000;z-index:30;overflow:auto;padding:16px}
#print h3{color:#000}
#print .ws img{max-width:100%;max-height:340px;display:block;margin:6px 0}
#print .ws{break-inside:avoid;margin-bottom:18px}
@media print{body>*:not(#print){display:none!important}#print{display:block!important;position:static;padding:0}#print .tb{display:none}}
</style>
</head>
<body>
<header>Türkçe Ders Asistanı</header>
<main id="view"></main>
<nav id="nav"></nav>
<div class="modal" id="modal"><div class="in" id="mc"></div></div>
<div class="modal" id="modal2"><div class="in" id="mc2"></div></div>
<div id="print"></div>
<input type="file" id="imp" accept="application/json" hidden>
<script>
/* ---------- Sabitler ---------- */
const TREE=[
['Sözcükte Anlam',['Gerçek, mecaz ve terim anlam','Eş, zıt, yakın anlam ve sesteşlik','Deyim ve atasözü','Söz sanatları']],
['Cümlede Anlam',['Cümle yorumlama','Neden-sonuç, amaç, koşul ilişkileri','Kesin yargı, öznel-nesnel anlatım','Anlamca birbirine yakın cümleler']],
['Paragraf',['Ana düşünce ve yardımcı düşünce','Konu ve başlık','Paragraf tamamlama','Akışı bozan cümle','Cümle ve paragraf sıralama','Anlatım teknikleri ve düşünceyi geliştirme yolları','Paragrafta yapı ve çıkarım']],
['Ses ve Yapı Bilgisi',['Ses olayları ve uyumlar','Hece bilgisi','Kök ve ekler','Sözcükte yapı']],
['Sözcük Türleri',['İsim, sıfat, zamir','Zarf, edat, bağlaç, ünlem','Fiiller (kip, kişi, ek fiil)','Fiilimsiler','Fiilde çatı']],
['Cümle Bilgisi',['Cümlenin ögeleri','Cümle türleri','Anlatım bozukluğu']],
['Yazım ve Noktalama',['Yazım kuralları','Noktalama işaretleri']]
];
const TYPES=['Bilgi sorusu','Olumsuz kök (söylenemez/çıkarılamaz)','Çıkarım','Yorum','Ana fikir / başlık','Sıralama / tamamlama','Karşılaştırma','Diğer'];
const DIFFS=['Kolay','Orta','Zor'];
const KINDS=['Anlatım','Soru çözümü','Tekrar','Deneme'];
const DAYS=['Paz','Pzt','Sal','Çar','Per','Cum','Cmt'];
const DAYS_ORDER=[1,2,3,4,5,6,0];
const MONTHS=['Oca','Şub','Mar','Nis','May','Haz','Tem','Ağu','Eyl','Eki','Kas','Ara'];
const CARDS0=[
['de / da','Bağlaç olan de/da ayrı yazılır ve ünlü uyumuna uymaz. Bulunma eki -de/-da bitişik yazılır (ünsüz benzeşmesiyle -te/-ta olur).'],
['ki','Bağlaç olan ki ayrı yazılır. Aitlik bildiren -ki bitişik yazılır (evdeki). Bazı sözcüklerde kalıplaşmıştır: sanki, oysaki, mademki, halbuki.'],
['mi','Soru eki mi ayrı yazılır; ondan sonra gelen ek ona bitişik yazılır (okudun mu, gelmiş miydi).'],
['Büyük harf','Cümle başı, özel adlar, unvan ve rütbeler kişi adından önce gelirse büyük yazılır.']
];

/* ---------- Yardımcılar ---------- */
const p2=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate());
const td=()=>iso(new Date());
const fdate=s=>{if(!s)return 'Yer yok';const d=new Date(s+'T12:00:00');return DAYS[d.getDay()]+' '+d.getDate()+' '+MONTHS[d.getMonth()]};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $=id=>document.getElementById(id);
const val=id=>($(id)||{}).value||'';
const say=(id,t)=>{const e=$(id);if(e)e.textContent=t};
function md(t){
 return esc(t).split('\n').map(l=>{
  if(/^#{1,3}\s+/.test(l))return '<h3>'+l.replace(/^#{1,3}\s+/,'')+'</h3>';
  if(/^\s*[-*]\s+/.test(l))return '<div class="li">• '+l.replace(/^\s*[-*]\s+/,'')+'</div>';
  return l.trim()?'<p>'+l+'</p>':'';
 }).join('').replace(/\*\*(.+?)\*\*/g,'<b>$1</b>');
}

/* ---------- Durum ---------- */
const DEF={settings:{yks:'',key:'',model:'gemini-2.5-flash',days:[1,2,3,4,5],perDay:1,dur:40,start:''},plan:{items:[],sessions:[],analysis:''},lessons:{},qs:[],cards:[]};
let S;
try{S=JSON.parse(localStorage.getItem('tt_state'))}catch(e){}
S=Object.assign({},DEF,S||{});
S.settings=Object.assign({},DEF.settings,S.settings||{});
S.plan=Object.assign({},DEF.plan,S.plan||{});
const save=()=>{try{localStorage.setItem('tt_state',JSON.stringify(S))}catch(e){alert('Kayıt başarısız: depolama dolu olabilir. Yedek alıp eski kayıtları silin.')}};
const allTopics=()=>{const a=[];TREE.forEach(([g,l])=>l.forEach(n=>a.push(n)));S.plan.items.forEach(i=>{if(!a.includes(i.topic))a.push(i.topic)});return a};
const topicOpts=sel=>{const l=allTopics();if(sel&&!l.includes(sel))l.push(sel);return '<option value="">Konu seç</option>'+l.map(t=>`<option ${t===sel?'selected':''}>${esc(t)}</option>`).join('')};
const listOpts=(l,sel)=>l.map(x=>`<option ${x===sel?'selected':''}>${esc(x)}</option>`).join('');

/* ---------- Fotoğraf deposu ---------- */
const idb=new Promise((res,rej)=>{const r=indexedDB.open('tt',1);r.onupgradeneeded=()=>r.result.createObjectStore('p');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
const pput=async(k,v)=>{const d=await idb;return new Promise(r=>{const t=d.transaction('p','readwrite');t.objectStore('p').put(v,k);t.oncomplete=r})};
const pget=async k=>{const d=await idb;return new Promise(r=>{const q=d.transaction('p').objectStore('p').get(k);q.onsuccess=()=>r(q.result)})};
const pdel=async k=>{const d=await idb;return new Promise(r=>{const t=d.transaction('p','readwrite');t.objectStore('p').delete(k);t.oncomplete=r})};
function shrink(file){return new Promise((res,rej)=>{const im=new Image(),u=URL.createObjectURL(file);im.onload=()=>{const m=1400,s=Math.min(1,m/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*s;c.height=im.height*s;c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);res(c.toDataURL('image/jpeg',.82))};im.onerror=rej;im.src=u})}
const b64=f=>new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result.split(',')[1]);r.onerror=rej;r.readAsDataURL(f)});
async function hydrate(){for(const im of document.querySelectorAll('img[data-p]')){const v=await pget(im.dataset.p);if(v)im.src=v}}

/* ---------- Yapay zekâ ---------- */
async function gem(parts,json){
 const body={contents:[{parts}]};
 if(json)body.generationConfig={responseMimeType:'application/json'};
 const r=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${S.settings.model||'gemini-2.5-flash'}:generateContent`,{method:'POST',headers:{'Content-Type':'application/json','x-goog-api-key':S.settings.key},body:JSON.stringify(body)});
 const j=await r.json();if(!r.ok)throw new Error(j.error&&j.error.message||r.status);
 const txt=((j.candidates&&j.candidates[0]&&j.candidates[0].content.parts)||[]).map(p=>p.text||'').join('');
 if(!txt)throw new Error('Boş yanıt döndü');
 return txt;
}
function parseJSON(t){
 t=String(t).replace(/^```(?:json)?/i,'').replace(/```\s*$/,'').trim();
 const i=t.search(/[\[{]/);if(i<0)throw new Error('JSON bulunamadı');
 let v=JSON.parse(t.slice(i,Math.max(t.lastIndexOf(']'),t.lastIndexOf('}'))+1));
 return v;
}
/* Anahtar yoksa: istemi kopyala, yanıtı yapıştır */
function manual(title,prompt,onDone){
 window._mh=onDone;
 $('mc2').innerHTML=`<button class="b s" data-a="closeM2">← Geri</button><h2>${esc(title)}</h2>
 <div class="mu">Anahtar girilmediği için elle ilerliyoruz: 1) İstemi kopyala 2) Claude uygulamasına yapıştır (gerekirse dosyayı/fotoğrafı da ekle) 3) Gelen yanıtı aşağıya yapıştır.</div>
 <div class="pre" id="mpre">${esc(prompt)}</div>
 <button class="b" data-a="copyM">İstemi kopyala</button><div class="mu" id="mst"></div>
 <textarea id="mresp" placeholder="Claude'un yanıtını buraya yapıştır" style="min-height:160px"></textarea>
 <button class="b" data-a="applyM">Uygula</button>`;
 $('modal2').style.display='block';
}

/* ---------- Takvim ve program ---------- */
function slotDates(max){
 const st=S.settings,out=[];
 const from=new Date();from.setHours(12,0,0,0);
 if(st.start){const s=new Date(st.start+'T12:00:00');if(s>from)from.setTime(s.getTime())}
 const end=st.yks?new Date(st.yks+'T12:00:00'):null;
 const today=td();
 const doneToday=S.plan.sessions.filter(x=>x.done&&x.date===today).length;
 const d=new Date(from);let g=0;
 while(g++<900&&out.length<max){
  if(end&&d>end)break;
  if(st.days.includes(d.getDay())){
   let n=st.perDay;if(iso(d)===today)n=Math.max(0,n-doneToday);
   for(let j=0;j<n&&out.length<max;j++)out.push(iso(d));
  }
  d.setDate(d.getDate()+1);
 }
 return out;
}
function assignDates(){
 const pend=S.plan.sessions.filter(x=>!x.done);
 const sl=slotDates(pend.length);
 pend.forEach((s,i)=>s.date=sl[i]||null);
}
function stats(){
 const pend=S.plan.sessions.filter(x=>!x.done);
 const slots=slotDates(2000).length;
 const dated=pend.filter(x=>x.date);
 return{total:pend.length,slots,over:pend.length-dated.length,last:dated.length?dated[dated.length-1].date:null,done:S.plan.sessions.length-pend.length};
}
function doneTopics(){return new Set(S.plan.sessions.filter(x=>x.done&&x.kind==='Anlatım').map(x=>x.topic))}
function buildLocal(){
 const dt=doneTopics(),out=[],recent=[];let n=0;
 S.plan.items.forEach(it=>{
  if(dt.has(it.topic))return;
  const c=Math.max(1,Math.round(+it.hours||1));
  for(let i=0;i<c;i++){out.push({id:uid(),topic:it.topic,outcome:it.outcome||'',kind:'Anlatım',note:c>1?`Ders ${i+1}/${c}`:''});n++}
  recent.push(it.topic);
  if(recent.length>=4){out.push({id:uid(),topic:'Genel tekrar',kind:'Tekrar',note:'Son konular: '+recent.join(', ')});recent.length=0}
 });
 return out;
}
const normKind=t=>{t=String(t||'').toLocaleLowerCase('tr');return t.includes('tekrar')?'Tekrar':t.includes('deneme')?'Deneme':t.includes('soru')?'Soru çözümü':'Anlatım'};
function setSessions(pend,analysis){
 const keep=S.plan.sessions.filter(x=>x.done);
 S.plan.sessions=keep.concat(pend);
 if(analysis!==undefined)S.plan.analysis=analysis;
 assignDates();save();render();
}
async function buildProgram(ai){
 if(!S.plan.items.length)return alert('Önce yıllık plan konularını ekle.');
 if(!ai){setSessions(buildLocal(),'');return}
 const dt=doneTopics(),rest=S.plan.items.filter(i=>!dt.has(i.topic));
 const slots=slotDates(2000).length;
 const prompt=`Sen deneyimli bir YKS TYT Türkçe dersi öğretmenisin. Aşağıdaki yıllık planı analiz et ve öğretmen için ders sırası öner.
Bugün: ${td()}. YKS tarihi: ${S.settings.yks||'belirtilmedi'}. Her ders ${S.settings.dur} dakika. Takvimde YKS'ye kadar kalan toplam ders yeri: ${slots}.
Plan konuları (hafta | tarih | konu | kazanım | ders sayısı):
${rest.map(i=>[i.week||'',i.dates||'',i.topic,i.outcome||'',i.hours||1].join(' | ')).join('\n')}

Kurallar:
- Oturum sayısı ${slots} dersi geçmesin; sona en az %10 tekrar ve deneme payı bırak.
- TYT Türkçe'de çıkan soru ağırlığına göre (paragraf ve anlam bilgisi ağır basar) süreyi dağıt; zayıf kalabilecek konulara fazla süre ver, gereksiz uzamış konuları kısalt.
- Planın sırasını mümkün olduğunca koru ama öğrenmeyi kolaylaştıran sıralama sorunları varsa düzelt (örn. önkoşul konular önce).
- Her 4-5 konudan sonra "Tekrar", ara ara "Soru çözümü", dönem sonlarında "Deneme" oturumu ekle.
- Her oturum bir dersi temsil eder; çok derse yayılan konuyu birden fazla oturum olarak yaz.
Yalnızca şu JSON biçiminde yanıt ver:
{"analiz":"Plan hakkında kısa ve net bir değerlendirme (süre yeterli mi, hangi konular riskli, ne önerirsin; en fazla 8 madde, satır sonlarıyla)","oturumlar":[{"konu":"...","tur":"Anlatım|Soru çözümü|Tekrar|Deneme","not":"kısa odak notu"}]}`;
 const apply=out=>{
  const o=parseJSON(out);
  const list=(o.oturumlar||[]).filter(x=>x&&x.konu).map(x=>{
   const it=S.plan.items.find(i=>i.topic===x.konu)||S.plan.items.find(i=>x.konu.includes(i.topic)||i.topic.includes(x.konu))||{};
   return{id:uid(),topic:x.konu,outcome:it.outcome||'',kind:normKind(x.tur),note:x.not||''};
  });
  if(!list.length)throw new Error('Yanıtta oturum listesi yok');
  setSessions(list,o.analiz||'');
 };
 if(S.settings.key){
  say('pst','Plan analiz ediliyor, bu biraz sürebilir...');
  try{apply(await gem([{text:prompt}],true))}catch(e){say('pst','Hata: '+e.message+'. Anahtarı ve interneti kontrol et ya da "Basit program" seç.')}
 }else manual('Plan analizi',prompt,r=>{try{apply(r);$('modal2').style.display='none'}catch(e){say('mst','Yanıt okunamadı: '+e.message)}});
}

/* ---------- Yıllık planı okuma ---------- */
const PLAN_PROMPT=`Aşağıdaki, bir öğretmenin yıllık ders planıdır (tablo, metin veya fotoğraf olabilir). İçindeki konuları sırayla çıkar. Yalnızca JSON dizisi döndür, açıklama yazma. Her eleman: {"hafta":sayı veya null,"tarih":"plandaki tarih/hafta aralığı metni veya boş","konu":"konu/ünite adı","kazanim":"kazanım veya açıklama, yoksa boş","saat":bu konuya ayrılan ders saati (sayı, yoksa 1)}. Planda olmayan bilgi uydurma. Tatil/sınav haftası satırlarını da ayrı eleman olarak koyma.`;
function parseLines(t){
 return t.split('\n').map(l=>l.trim().replace(/^\d+[\.\)]\s*/,'')).filter(l=>l.length>2).map(l=>{
  const c=l.split(/\t|;|\|/).map(x=>x.trim()).filter(Boolean);
  return{konu:c[0],kazanim:c.slice(1).join(' – '),saat:1};
 });
}
function setItems(arr){
 if(!Array.isArray(arr)){const k=Object.values(arr||{}).find(Array.isArray);arr=k}
 const items=(arr||[]).filter(x=>x&&(x.konu||x.topic)).map(x=>({id:uid(),week:x.hafta||'',dates:x.tarih||'',topic:String(x.konu||x.topic).trim(),outcome:String(x.kazanim||x.outcome||'').trim(),hours:Math.max(1,Math.round(+x.saat||1))}));
 if(!items.length)throw new Error('Plandan konu çıkarılamadı');
 S.plan.items=items;save();window._pf=null;render();
}
async function readPlan(){
 const f=window._pf;
 const txt=(val('ptxt')+(f&&f.text?'\n'+f.text:'')).trim();
 const bin=f&&!f.text?f:null;
 if(!txt&&!bin)return alert('Bir dosya seç ya da planı kutuya yapıştır.');
 if(S.plan.sessions.some(x=>x.done)&&!confirm('Plan değişirse tamamlanan dersler korunur ama yeni konu listesi eskisinin yerine geçer. Devam?'))return;
 const prompt=PLAN_PROMPT+(txt?'\n\nYıllık plan metni:\n'+txt:'');
 if(S.settings.key){
  say('pst','Plan okunuyor...');
  try{
   const parts=[{text:prompt}];
   if(bin)parts.push({inline_data:{mime_type:bin.mime,data:bin.data}});
   setItems(parseJSON(await gem(parts,true)));
  }catch(e){say('pst','Hata: '+e.message+'. Dosya çok büyük olabilir; metni yapıştırmayı dene.')}
 }else if(!bin){
  try{setItems(parseLines(txt).map(x=>x))}catch(e){say('pst',e.message)}
 }else manual('Yıllık planı oku',prompt,r=>{try{setItems(parseJSON(r));$('modal2').style.display='none'}catch(e){say('mst','Yanıt okunamadı: '+e.message)}});
}
async function pickPlanFile(f){
 if(!f)return;
 const n=f.name.toLowerCase();
 try{
  if(f.type.startsWith('image/')){const d=await shrink(f);window._pf={mime:'image/jpeg',data:d.split(',')[1]}}
  else if(f.type==='application/pdf'||n.endsWith('.pdf')){if(f.size>15e6)return alert('PDF 15 MB üstü, küçültüp tekrar dene.');window._pf={mime:'application/pdf',data:await b64(f)}}
  else if(/\.(txt|csv|tsv)$/.test(n)||f.type.startsWith('text/')){window._pf={text:await f.text()}}
  else return alert('Bu dosya türü okunamıyor. Word veya Excel dosyasını PDF olarak kaydedip yükle ya da metni yapıştır.');
  say('pfn','Seçildi: '+f.name);
 }catch(e){alert('Dosya okunamadı')}
}

async function analyze(id){

  if(q.photo){const d=await pget(q.id);parts.push({inline_data:{mime_type:'image/jpeg',data:d.split(',')[1]}})}

  q.ai=txt;q.aiDate=td();
  const k=txt.match(/KONU:\s*(.+)/),t=txt.match(/T[İI]P:\s*(.+)/);
  if(!q.topic&&k){const m=allTopics().find(x=>k[1].includes(x));if(m)q.topic=m}

 <label class="mu">Model adı</label><input id="sm" value="${esc(S.settings.model)}">
 <div class="mu">aistudio.google.com → "Get API key" ile ücretsiz alınır. Ücretsiz kota ve model adları zamanla değişebilir. Plan, soru fotoğrafı ve ders istemleri analiz sırasında Google'a gönderilir; öğrenci adı veya kişisel veri içeren içerik gönderme.</div>
 <button class="b" data-a="saveKey">Kaydet</button></div>
 <div class="card"><h2>Zamanlayıcı</h2><div class="big-t" id="tmv">${mmss(Math.max(tm.left,0))}</div>
 <div style="text-align:center">${[[60,'1 dk'],[90,'1,5 dk'],[120,'2 dk'],[300,'5 dk'],[2400,'40 dk']].map(([s,l])=>`<button class="b s" data-a="tmset" data-v="${s}">${l}</button>`).join('')}<br>
 <button class="b" id="tmb" data-a="tmgo">${tm.run?'Duraklat':'Başlat'}</button></div></div>
 <div class="card"><h2>Kural kartları</h2><div class="mu">Karta dokun: cevabı gör. Kuralları resmî kaynaktan kontrol et.</div><br>
 ${cards.map((c,i)=>`<div class="flip" data-a="flip" data-v="${esc(c[1])}">${esc(c[0])}</div>${i>=CARDS0.length?`<button class="b d sm" data-a="delCard" data-v="${i-CARDS0.length}">Kartı sil</button>`:''}`).join('')}
 <input id="cf" placeholder="Kart başlığı"><textarea id="cb" placeholder="Kural / açıklama"></textarea><button class="b s" data-a="addCard">Kart ekle</button></div>
 <div class="card"><h2>Yedek</h2><div class="mu">Veriler bu cihazın tarayıcısında durur. Telefon değiştirirken veya bilgisayara taşırken yedek al.</div>
 <button class="b s" data-a="export">Yedeği indir</button><button class="b s" data-a="import">Yedeği yükle</button><button class="b d" data-a="reset">Her şeyi sil</button></div>`;
}

/* ---------- Olaylar ---------- */
document.addEventListener('click',async e=>{
 const t=e.target.closest('[data-a]');if(!t||t.tagName==='SELECT'||(t.tagName==='INPUT'&&t.type==='checkbox'&&t.dataset.a!=='selQ'))return;
 const a=t.dataset.a,v=t.dataset.v;
 switch(a){
 case'tab':tab=v;render();window.scrollTo(0,0);break;
 case'readPlan':readPlan();break;
 case'tplPlan':{const it=[];TREE.forEach(([g,l])=>l.forEach(n=>it.push({konu:n,kazanim:g,saat:g==='Paragraf'?3:2})));setItems(it);break}
 case'delItem':S.plan.items=S.plan.items.filter(x=>x.id!==v);save();render_keep();break;
 case'addItem':{const n=val('ni').trim();if(!n)return;S.plan.items.push({id:uid(),week:'',dates:'',topic:n,outcome:'',hours:1});save();render_keep();break}
 case'clearPlan':if(confirm('Yıllık plan ve oluşturulmuş program silinsin mi? (Tamamlanan dersler korunur)')){S.plan.items=[];S.plan.analysis='';S.plan.sessions=S.plan.sessions.filter(x=>x.done);save();render()}break;
 case'saveCal':{const days=[...document.querySelectorAll('.dy:checked')].map(x=>+x.value);if(!days.length)return alert('En az bir ders günü seç');
  Object.assign(S.settings,{days,perDay:Math.max(1,+val('cpd')||1),dur:+val('cdu')||40,start:val('cst'),yks:val('cyk')});assignDates();save();render_keep();break}
 case'build':buildProgram(v==='1');break;
 case'toggleAll':window._all=!window._all;render_keep();break;
 case'delSes':S.plan.sessions=S.plan.sessions.filter(x=>x.id!==v);assignDates();save();render_keep();break;
 case'addSes':{const tp=val('as_t').trim();if(!tp)return alert('Konu adı yaz');const s={id:uid(),topic:tp,outcome:'',kind:val('as_k'),note:''};
  const i=S.plan.sessions.findIndex(x=>!x.done);S.plan.sessions.splice(i<0?S.plan.sessions.length:i+1,0,s);assignDates();save();render_keep();break}
 case'openL':openLesson(v);break;
 case'genL':genLesson(v);break;
 case'editL':openM(`<button class="b s" data-a="openL" data-v="${v}">← Vazgeç</button><h2>Ders planını düzenle</h2><textarea id="le" style="min-height:420px">${esc(S.lessons[v])}</textarea><button class="b" data-a="saveL" data-v="${v}">Kaydet</button>`);break;
 case'saveL':S.lessons[v]=val('le');save();openLesson(v);break;
 case'printL':{const s=S.plan.sessions.find(x=>x.id===v);const p=$('print');p.innerHTML=`<div class="tb"><button class="b" onclick="window.print()">Yazdır / PDF kaydet</button><button class="b s" onclick="document.getElementById('print').style.display='none'">Kapat</button></div><h2>${esc(s.topic)} · ${esc(s.kind)}</h2><div class="ai">${md(S.lessons[v])}</div>`;p.style.display='block';break}
 case'finishForm':openM(`<button class="b s" data-a="openL" data-v="${v}">← Geri</button><div class="card"><h2>Dersi bitir</h2>
  <textarea id="fn" placeholder="Kısa ders notu: ne anlaşıldı, ne anlaşılmadı?"></textarea>
  <label><input type="checkbox" id="fr">Konu tekrar edilmeli (sıradaki derse tekrar dersi eklenir)</label><br><br>
  <button class="b" data-a="finish" data-v="${v}">Tamamla</button></div>`);break;
 case'finish':{const s=S.plan.sessions.find(x=>x.id===v);s.done=true;s.date=td();s.doneNote=val('fn');
  if($('fr').checked){const i=S.plan.sessions.findIndex(x=>!x.done);const r={id:uid(),topic:s.topic,outcome:s.outcome,kind:'Tekrar',note:'Önceki derste tam anlaşılmadı'+(s.doneNote?': '+s.doneNote:'')};S.plan.sessions.splice(i<0?S.plan.sessions.length:i,0,r)}
  assignDates();save();closeM();render();break}
 case'closeM':closeM();break;
 case'closeM2':$('modal2').style.display='none';break;
 case'copyM':try{await navigator.clipboard.writeText($('mpre').textContent);say('mst','İstem kopyalandı.')}catch(er){say('mst','Kopyalama başarısız; metni elle seçip kopyala.')}break;
 case'applyM':{const r=val('mresp').trim();if(!r)return say('mst','Önce yanıtı yapıştır');if(window._mh)window._mh(r);break}
 case'newQ':openM(formQ({}));$('qf').onchange=async ev=>{const f=ev.target.files[0];if(f){window._ph=await shrink(f);say('qpv','Fotoğraf hazır ✓')}};window._ph=null;break;
 case'saveQ':{
  const id=v,fld={topic:val('qt'),type:val('qy'),diff:val('qd'),ans:val('qa'),note:val('qn')};
  if(id){Object.assign(S.qs.find(x=>x.id===id),fld);save();openQ(id);render_keep();break}
  if(!window._ph&&!fld.note.trim())return alert('Fotoğraf çek ya da soru metni yaz');
  const q=Object.assign({id:uid(),date:td()},fld);if(window._ph){q.photo=1;await pput(q.id,window._ph)}else q.text=fld.note,q.note='';
  S.qs.push(q);save();window._ph=null;render();openQ(q.id);break}
 case'openQ':openQ(v);break;
 case'editQ':openM(formQ(S.qs.find(x=>x.id===v)));break;
 case'delQ':if(confirm('Soru silinsin mi?')){S.qs=S.qs.filter(x=>x.id!==v);sel.delete(v);await pdel(v);save();closeM();render()}break;
 case'analyze':analyze(v);break;
 case'copyP':{const q=S.qs.find(x=>x.id===v);try{await navigator.clipboard.writeText(buildPrompt(q));say('aist','İstem kopyalandı. Claude uygulamasına yapıştır ve fotoğrafı ekle.')}catch(er){say('aist','Kopyalama başarısız')}break}
 case'shareQ':{const d=await pget(v);const b=await (await fetch(d)).blob();const f=new File([b],'soru.jpg',{type:'image/jpeg'});if(navigator.canShare&&navigator.canShare({files:[f]}))navigator.share({files:[f]}).catch(()=>{});else say('aist','Bu cihaz paylaşımı desteklemiyor; fotoğrafı galeriden ekle.');break}
 case'selQ':t.checked?sel.add(v):sel.delete(v);render_keep();break;
 case'ws':makeWs();break;
 case'saveKey':S.settings.key=val('sk').trim();S.settings.model=val('sm').trim()||'gemini-2.5-flash';save();alert('Kaydedildi');break;
 case'tmset':clearInterval(tm.iv);tm={left:+v,run:false,iv:null};render();break;
 case'tmgo':if(tm.run){clearInterval(tm.iv);tm.run=false}else{if(tm.left<=0)return;tm.run=true;tm.iv=setInterval(tmTick,1000)}$('tmb').textContent=tm.run?'Duraklat':'Başlat';break;
 case'flip':{const o=t.textContent;t.textContent=t.dataset.v;t.dataset.v=o;break}
 case'addCard':{const f=val('cf').trim(),b=val('cb').trim();if(!f||!b)return;S.cards.push([f,b]);save();render();break}
 case'delCard':S.cards.splice(+v,1);save();render();break;
 case'export':{const photos={};for(const q of S.qs)if(q.photo)photos[q.id]=await pget(q.id);const b=new Blob([JSON.stringify({state:S,photos})],{type:'application/json'});const u=URL.createObjectURL(b),l=document.createElement('a');l.href=u;l.download='turkce-yedek-'+td()+'.json';l.click();break}
 case'import':$('imp').click();break;
 case'reset':if(confirm('Tüm veriler silinecek. Emin misin?')&&confirm('Bu işlem geri alınamaz.')){localStorage.removeItem('tt_state');for(const q of S.qs)await pdel(q.id);location.reload()}break;
 }
});
document.addEventListener('change',e=>{
 const t=e.target;
 if(t.id==='flt'){window._f=t.value;render_keep()}
 if(t.id==='pf')pickPlanFile(t.files[0]);
 if(t.dataset.c==='hrs'){const it=S.plan.items.find(x=>x.id===t.dataset.v);if(it){it.hours=Math.max(1,Math.min(20,Math.round(+t.value)||1));save()}}
});
$('imp').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const d=JSON.parse(await f.text());if(!d.state)throw 0;if(!confirm('Mevcut veriler bu yedekle değiştirilecek. Devam?'))return;S=Object.assign({},DEF,d.state);S.settings=Object.assign({},DEF.settings,S.settings||{});S.plan=Object.assign({},DEF.plan,S.plan||{});for(const k in d.photos||{})await pput(k,d.photos[k]);save();render()}catch(er){alert('Geçersiz yedek dosyası')}e.target.value=''};
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
assignDates();render();
</script>
</body>
</html>
